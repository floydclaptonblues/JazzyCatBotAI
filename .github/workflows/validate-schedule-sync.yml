name: Validate JazzyCat schedule sync

on:
  pull_request:
    paths:
      - 'data/jazzycat-current-schedule.json'
      - 'assets/jazzycat-schedule-runtime.js'
      - 'scripts/validate_schedule_sync.py'
      - 'tests/**'
      - '.github/workflows/validate-schedule-sync.yml'
  push:
    branches:
      - main
    paths:
      - 'data/jazzycat-current-schedule.json'
      - 'assets/jazzycat-schedule-runtime.js'
      - 'scripts/validate_schedule_sync.py'
      - 'tests/**'
      - '.github/workflows/validate-schedule-sync.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out JazzyCatBotAI
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runtime syntax
        run: node --check assets/jazzycat-schedule-runtime.js
      - name: Run date-aware runtime regressions
        run: node --test tests/schedule-runtime.test.cjs
      - name: Run validator regressions
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate fallback against UpcomingShows
        run: python scripts/validate_schedule_sync.py

